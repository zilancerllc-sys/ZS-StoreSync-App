# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "585da15efd020b39fd2f3cd76f38c4ef"
name = "ZS-StoreSync"
application_url = "https://zs-store-sync.fly.dev"
embedded = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_products,write_products,read_content,write_content,read_files,write_files,read_metaobjects,write_metaobjects,read_metaobject_definitions,write_metaobject_definitions,read_discounts,write_discounts,read_online_store_navigation,write_online_store_navigation,read_customers,write_customers,read_orders,write_orders,read_draft_orders,write_draft_orders"

[webhooks]
# Must track the ApiVersion the app code is built against (app/shopify.server.js
# uses ApiVersion.October25). Declaring a newer version here made Shopify send
# payloads in a format the handlers were never written for — app_subscriptions
# /update in particular reads status, name, admin_graphql_api_id and
# current_period_end straight off the payload.
api_version = "2025-10"

  [webhooks.privacy_compliance]
  customer_data_request_url = "/webhooks/customers/data_request"
  customer_deletion_url = "/webhooks/customers/redact"
  shop_deletion_url = "/webhooks/shop/redact"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  # Billing lifecycle: keeps the stored plan in sync when a subscription is
  # activated, cancelled, expires, or a payment is declined. Without this
  # subscription cancellations would never downgrade the plan.
  [[webhooks.subscriptions]]
  uri = "/webhooks/app-subscriptions-update"
  topics = [ "app_subscriptions/update" ]

[auth]
redirect_urls = [
  "https://zs-store-sync.fly.dev/auth/callback",
  "https://zs-store-sync.fly.dev/auth/shopify/callback",
  "https://zs-store-sync.fly.dev/api/auth/callback"
]

[build]
automatically_update_urls_on_dev = true
